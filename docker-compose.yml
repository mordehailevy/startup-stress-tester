version: "3.9"

services:
  # ── MongoDB ────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.example
      # Your real values (GEMINI_API_KEY…) live in .env, which git ignores.
      - path: .env
        required: false
    environment:
      - MONGODB_URI=mongodb://mongo:27017/startup-stress-tester
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  # ── Frontend ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
